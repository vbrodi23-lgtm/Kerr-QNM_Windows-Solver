[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-windows-solver"
version = "0.2.0"
description = "Evidence-graded nonlinear Kerr ringdown solver"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = [
    "NOTICE.md",
    "src/windows_solver/data/LICENSE-CANONICAL-BACKEND-MIT.txt",
    "src/windows_solver/data/LICENSE-CC-BY-4.0.txt",
    "src/windows_solver/data/LICENSE-QNM-MIT.txt",
]
dependencies = []

[project.optional-dependencies]
numerical-tests = [
    "numpy==2.4.6",
    "scipy==1.18.0",
]

[project.scripts]
solver = "windows_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
windows_solver = [
    "data/kerr_qnm_roots_2736.csv",
    "data/kerr_qnm_lattice_receipt.json",
    "data/LICENSE-CANONICAL-BACKEND-MIT.txt",
    "data/LICENSE-CC-BY-4.0.txt",
    "data/LICENSE-QNM-MIT.txt",
]
