[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-windows-solver"
version = "0.2.0"
description = "Evidence-graded nonlinear Kerr ringdown solver"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = [
    "src/windows_solver/data/LICENSE-CANONICAL-BACKEND-MIT.txt",
    "src/windows_solver/data/LICENSE-CC-BY-4.0.txt",
    "src/windows_solver/data/LICENSE-QNM-MIT.txt",
]
dependencies = []

[project.optional-dependencies]
numerical-tests = [
    "numpy==2.4.6",
    "scipy==1.18.0",
]

[project.scripts]
solver = "windows_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
windows_solver = [
    "data/kerr_qnm_roots_2736.csv",
    "data/kerr_qnm_lattice_receipt.json",
    "data/kerr_qnm_m02_overlay_44.csv",
    "data/kerr_qnm_m02_overlay_receipt.json",
    "data/fixed_root_reliability_projection_authority_v1.json",
    "data/promoted_control_empirical_calibration_v1.json",
    "data/promoted_control_derivative_lower_bound_source_audit_v1.json",
    "data/release_domain_manifest.json",
    "data/evidence_intake/pilot/protocol.fixture",
    "data/evidence_intake/pilot/reduction.fixture",
    "data/evidence_intake/pilot/components.fixture",
    "data/evidence_intake/cubic/resolved.fixture",
    "data/evidence_intake/cubic/status.fixture",
    "data/response_replay/baselines.fixture",
    "data/response_replay/components.fixture",
    "data/response_replay/levels.fixture",
    "data/response_replay/protocol.fixture",
    "data/response_replay/reduction.fixture",
    "data/response_replay/repeats.fixture",
    "data/response_replay/signed-roots.fixture",
    "data/response_replay/summary.fixture",
    "data/native_kernel/potentials.fixture",
    "data/julia/generate_gsn_cache.jl",
    "data/julia/m02_worker.jl",
    "data/julia/m02_project/Project.toml",
    "data/julia/m02_project/Manifest.seed.toml",
    "data/julia/m03_worker.jl",
    "data/julia/m03_project/Project.toml",
    "data/julia/m03_project/Manifest.seed.toml",
    "data/julia/GeneralizedSasakiNakamura.jl/LICENSE",
    "data/julia/GeneralizedSasakiNakamura.jl/Project.toml",
    "data/julia/GeneralizedSasakiNakamura.jl/src/GeneralizedSasakiNakamura.jl",
    "data/julia/GeneralizedSasakiNakamura.jl/src/Homogeneous/*.jl",
    "data/julia/GeneralizedSasakiNakamura.jl/src/Inhomogeneous/*.jl",
    "data/julia/SpinWeightedSpheroidalHarmonics.jl/LICENSE",
    "data/julia/SpinWeightedSpheroidalHarmonics.jl/Project.toml",
    "data/julia/SpinWeightedSpheroidalHarmonics.jl/src/*.jl",
    "data/LICENSE-CANONICAL-BACKEND-MIT.txt",
    "data/LICENSE-CC-BY-4.0.txt",
    "data/LICENSE-QNM-MIT.txt",
]
