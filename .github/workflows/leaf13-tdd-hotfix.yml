name: leaf13-tdd-hotfix

on:
  push:
    branches:
      - fix/leaf13-mixed-phase-endpoint-evidence

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/leaf13-mixed-phase-endpoint-evidence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install ".[numerical-tests]"

      - name: Detect completed patch
        id: patch-state
        shell: bash
        run: |
          if grep -q "expected_order_ladders =" src/windows_solver/response_engine.py; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify regression is red
        if: steps.patch-state.outputs.applied != 'true'
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m unittest -v \
            tests.test_leaf13_mixed_phase_endpoint_evidence \
            > leaf13-red.log 2>&1
          status=$?
          set -e
          cat leaf13-red.log
          if [ "$status" -eq 0 ]; then
            echo "Leaf 13 regression unexpectedly passed before the fix" >&2
            exit 1
          fi
          grep -q \
            "test_accepts_primary_truncation_resolution_endpoint_evidence" \
            leaf13-red.log
          grep -q "horizon endpoint search evidence is invalid" leaf13-red.log

      - name: Apply minimal mixed-phase validator fix
        if: steps.patch-state.outputs.applied != 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/windows_solver/response_engine.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          function_start = next(
              index
              for index, line in enumerate(lines)
              if line == (
                  "def _validated_successful_horizon_endpoint_search_evidence(\n"
              )
          )
          function_end = next(
              index
              for index in range(function_start + 1, len(lines))
              if lines[index].startswith("def ")
          )

          def unique_index(value: str, start: int, end: int) -> int:
              matches = [
                  index
                  for index in range(start, end)
                  if lines[index] == value
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected one patch marker {value!r}, found {matches}"
                  )
              return matches[0]

          order_start = unique_index(
              "    expected_orders: list[int] = []\n",
              function_start,
              function_end,
          )
          order_end = unique_index(
              "    expected_orders.append(maximum_order)\n",
              order_start,
              function_end,
          ) + 1
          order_replacement = '''    def endpoint_order_ladder(
              candidate_base_order: int,
          ) -> list[int]:
              values: list[int] = []
              order = candidate_base_order
              while order < maximum_order:
                  values.append(order)
                  order += order
              values.append(maximum_order)
              return values

              allowed_base_orders = {base_order}
              if (
                  not allow_historical_schema7_policy
                  and request_binding.get("operation") == "root-readout"
                  and policy.get("promoted_root_readout_policy")
                  == PROMOTED_ROOT_READOUT_POLICY
                  and base_order + 8 <= maximum_order
              ):
                  # Schema v9 accumulates PRIMARY, TRUNCATION, and RESOLUTION
                  # endpoint searches in one response. TRUNCATION alone raises
                  # the endpoint base order by exactly eight.
                  allowed_base_orders.add(base_order + 8)
              expected_order_ladders = {
                  tuple(endpoint_order_ladder(candidate_base_order))
                  for candidate_base_order in sorted(allowed_base_orders)
              }
              expected_orders: list[int] = []
              observed_order_ladders: set[tuple[int, ...]] = set()
          '''.replace("          ", "")
          lines[order_start:order_end] = order_replacement.splitlines(
              keepends=True
          )

          function_end += len(order_replacement.splitlines()) - (
              order_end - order_start
          )
          order_mismatch = unique_index(
              "            or orders != expected_orders\n",
              function_start,
              function_end,
          )
          validation_start = next(
              index
              for index in range(order_mismatch, function_start - 1, -1)
              if lines[index] == "        if (\n"
          )
          validation_end = next(
              index
              for index in range(order_mismatch, function_end)
              if lines[index] == (
                  "            raise ValueError("
                  "\"horizon endpoint search evidence is invalid\")\n"
              )
          ) + 1
          validation_replacement = '''        if (
              not isinstance(orders, list)
              or not orders
              or any(
                  isinstance(order, bool)
                  or not isinstance(order, int)
                  or order < 1
                  for order in orders
              )
          ):
              raise ValueError("horizon endpoint search evidence is invalid")
              order_ladder = tuple(orders)
              if (
                  order_ladder not in expected_order_ladders
                  or item["outcome"] != expected_outcome
                  or item["policy_identity"] != policy_identity
                  or not isinstance(selected_pair, list)
                  or len(selected_pair) != required_selected_count
                  or not isinstance(rejected, list)
                  or item["homogeneous_rhs_evaluations_before_pair"] != 0
              ):
                  raise ValueError("horizon endpoint search evidence is invalid")
              expected_orders = list(order_ladder)
              observed_order_ladders.add(order_ladder)
          '''.replace("          ", "")
          lines[validation_start:validation_end] = (
              validation_replacement.splitlines(keepends=True)
          )

          function_end += len(validation_replacement.splitlines()) - (
              validation_end - validation_start
          )
          return_index = unique_index(
              "    return canonical\n",
              function_start,
              function_end,
          )
          primary_gate = '''    primary_order_ladder = tuple(
              endpoint_order_ladder(base_order)
          )
              if primary_order_ladder not in observed_order_ladders:
                  raise ValueError("horizon endpoint PRIMARY evidence is missing")
          '''.replace("          ", "")
          lines[return_index:return_index] = primary_gate.splitlines(
              keepends=True
          )

          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Verify focused regression is green
        if: steps.patch-state.outputs.applied != 'true'
        shell: bash
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest -v \
            tests.test_leaf13_mixed_phase_endpoint_evidence \
            tests.test_julia_response_backend.JuliaResponseBackendTests.test_successful_horizon_endpoint_evidence_is_sealed_in_receipt \
            tests.test_julia_response_backend.JuliaResponseBackendTests.test_horizon_endpoint_receipt_rejects_resealed_policy_geometry_and_order_forgery

      - name: Commit production fix
        if: steps.patch-state.outputs.applied != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_solver/response_engine.py
          git commit -m "fix(m02): authenticate mixed-phase endpoint evidence"
          git push origin HEAD:fix/leaf13-mixed-phase-endpoint-evidence
