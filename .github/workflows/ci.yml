name: verify

on:
  pull_request:

permissions:
  contents: write

jobs:
  leaf13-source-patch:
    if: github.event.pull_request.head.ref == 'fix/leaf13-mixed-phase-endpoint-evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install ".[numerical-tests]"
      - name: Reconfirm the production regression is red
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m unittest -v \
            tests.test_leaf13_mixed_phase_endpoint_evidence \
            > leaf13-red.log 2>&1
          status=$?
          set -e
          cat leaf13-red.log
          if [ "$status" -eq 0 ]; then
            echo "Leaf 13 regression unexpectedly passed before the repair" >&2
            exit 1
          fi
          grep -q \
            "test_accepts_primary_truncation_resolution_endpoint_evidence" \
            leaf13-red.log
          grep -q "horizon endpoint search evidence is invalid" leaf13-red.log
      - name: Apply the mixed-phase endpoint validator repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/windows_solver/response_engine.py")
          text = path.read_text(encoding="utf-8")
          function_marker = (
              "def _validated_successful_horizon_endpoint_search_evidence(\n"
          )
          function_start = text.index(function_marker)
          function_end = text.index("\ndef ", function_start + 1)
          function = text[function_start:function_end]

          old_orders = (
              "    expected_orders: list[int] = []\n"
              "    order = base_order\n"
              "    while order < maximum_order:\n"
              "        expected_orders.append(order)\n"
              "        order += order\n"
              "    expected_orders.append(maximum_order)\n"
          )
          new_orders = (
              "    def endpoint_order_ladder(\n"
              "        candidate_base_order: int,\n"
              "    ) -> list[int]:\n"
              "        values: list[int] = []\n"
              "        order = candidate_base_order\n"
              "        while order < maximum_order:\n"
              "            values.append(order)\n"
              "            order += order\n"
              "        values.append(maximum_order)\n"
              "        return values\n"
              "\n"
              "    allowed_base_orders = {base_order}\n"
              "    if (\n"
              "        not allow_historical_schema7_policy\n"
              "        and request_binding.get(\"operation\") == \"root-readout\"\n"
              "        and policy.get(\"promoted_root_readout_policy\")\n"
              "        == PROMOTED_ROOT_READOUT_POLICY\n"
              "        and base_order + 8 <= maximum_order\n"
              "    ):\n"
              "        # Schema v9 accumulates PRIMARY, TRUNCATION, and RESOLUTION\n"
              "        # endpoint searches in one response. TRUNCATION alone raises\n"
              "        # the endpoint base order by exactly eight.\n"
              "        allowed_base_orders.add(base_order + 8)\n"
              "    expected_order_ladders = {\n"
              "        tuple(endpoint_order_ladder(candidate_base_order))\n"
              "        for candidate_base_order in sorted(allowed_base_orders)\n"
              "    }\n"
              "    expected_orders: list[int] = []\n"
              "    observed_order_ladders: set[tuple[int, ...]] = set()\n"
          )
          if function.count(old_orders) != 1:
              raise SystemExit("endpoint order ladder patch marker is not unique")
          function = function.replace(old_orders, new_orders)

          mismatch_marker = "            or orders != expected_orders\n"
          mismatch = function.index(mismatch_marker)
          validation_start = function.rfind("        if (\n", 0, mismatch)
          error_line = (
              "            raise ValueError("
              "\"horizon endpoint search evidence is invalid\")\n"
          )
          validation_end = function.index(error_line, mismatch) + len(error_line)
          new_validation = (
              "        if (\n"
              "            not isinstance(orders, list)\n"
              "            or not orders\n"
              "            or any(\n"
              "                isinstance(order, bool)\n"
              "                or not isinstance(order, int)\n"
              "                or order < 1\n"
              "                for order in orders\n"
              "            )\n"
              "        ):\n"
              "            raise ValueError(\"horizon endpoint search evidence is invalid\")\n"
              "        order_ladder = tuple(orders)\n"
              "        if (\n"
              "            order_ladder not in expected_order_ladders\n"
              "            or item[\"outcome\"] != expected_outcome\n"
              "            or item[\"policy_identity\"] != policy_identity\n"
              "            or not isinstance(selected_pair, list)\n"
              "            or len(selected_pair) != required_selected_count\n"
              "            or not isinstance(rejected, list)\n"
              "            or item[\"homogeneous_rhs_evaluations_before_pair\"] != 0\n"
              "        ):\n"
              "            raise ValueError(\"horizon endpoint search evidence is invalid\")\n"
              "        expected_orders = list(order_ladder)\n"
              "        observed_order_ladders.add(order_ladder)\n"
          )
          function = (
              function[:validation_start]
              + new_validation
              + function[validation_end:]
          )

          return_line = "    return canonical\n"
          return_index = function.rfind(return_line)
          if return_index < 0:
              raise SystemExit("canonical return marker was not found")
          primary_gate = (
              "    primary_order_ladder = tuple(\n"
              "        endpoint_order_ladder(base_order)\n"
              "    )\n"
              "    if primary_order_ladder not in observed_order_ladders:\n"
              "        raise ValueError(\"horizon endpoint PRIMARY evidence is missing\")\n"
          )
          function = (
              function[:return_index]
              + primary_gate
              + function[return_index:]
          )
          text = text[:function_start] + function + text[function_end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Prove the focused repair is green
        shell: bash
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest -v \
            tests.test_leaf13_mixed_phase_endpoint_evidence \
            tests.test_julia_response_backend
          git diff --check
      - name: Commit the production repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_solver/response_engine.py
          git commit -m "fix(m02): authenticate mixed-phase endpoint evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
