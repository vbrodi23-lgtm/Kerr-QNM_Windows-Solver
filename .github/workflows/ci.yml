name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install .
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Plan full evidence request
        run: solver plan examples/evidence-plan.json
      - name: Run admitted provider
        run: solver run examples/problem-contract.json --store "${{ runner.temp }}/solver-store"
      - name: Verify Windows PowerShell 5.1 launcher parity
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          root = Path.cwd()
          windows_powershell = Path(os.environ["SystemRoot"]).joinpath(
              "System32", "WindowsPowerShell", "v1.0", "powershell.exe"
          )
          module = [sys.executable, "-m", "windows_solver"]
          launcher = [
              str(windows_powershell),
              "-NoLogo",
              "-NoProfile",
              "-NonInteractive",
              "-ExecutionPolicy",
              "Bypass",
              "-File",
              str(root / "solver.ps1"),
          ]

          def invoke(prefix, *arguments):
              return subprocess.run(
                  [*prefix, *(str(argument) for argument in arguments)],
                  cwd=root,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )

          def require(condition, message, *results):
              if condition:
                  return
              details = "\n".join(
                  f"rc={result.returncode} stdout={result.stdout!r} "
                  f"stderr={result.stderr!r}"
                  for result in results
              )
              raise AssertionError(f"{message}\n{details}")

          request = root / "examples" / "evidence-plan.json"
          direct = invoke(module, "plan", request)
          wrapped = invoke(launcher, "plan", request)
          require(
              direct.returncode == wrapped.returncode == 0,
              "Plan command failed through one Windows entry point.",
              direct,
              wrapped,
          )
          require(
              direct.stdout == wrapped.stdout and direct.stderr == wrapped.stderr == b"",
              "Windows entry points returned different plan streams.",
              direct,
              wrapped,
          )

          with tempfile.TemporaryDirectory() as temporary:
              temporary = Path(temporary)
              direct = invoke(
                  module,
                  "run",
                  request,
                  "--store",
                  temporary / "module-unavailable",
              )
              wrapped = invoke(
                  launcher,
                  "run",
                  request,
                  "--store",
                  temporary / "launcher-unavailable",
              )
              require(
                  direct.returncode == wrapped.returncode == 3,
                  "Unavailable science did not return exit code 3.",
                  direct,
                  wrapped,
              )
              require(
                  direct.stdout == wrapped.stdout == b"",
                  "Unavailable science unexpectedly wrote stdout.",
                  direct,
                  wrapped,
              )
              direct_error = json.loads(direct.stderr)
              wrapped_error = json.loads(wrapped.stderr)
              require(
                  direct_error["error"]["code"]
                  == wrapped_error["error"]["code"]
                  == "PROVIDER_UNAVAILABLE",
                  "Windows entry points returned different error contracts.",
                  direct,
                  wrapped,
              )
              require(
                  direct_error["error"]["run"]["unavailable_capability"]
                  == wrapped_error["error"]["run"]["unavailable_capability"],
                  "Windows entry points disagreed on unavailable capability.",
                  direct,
                  wrapped,
              )

              invalid = temporary / "invalid-study.json"
              invalid.write_bytes(b"{}")
              direct = invoke(module, "plan", invalid)
              wrapped = invoke(launcher, "plan", invalid)
              require(
                  direct.returncode == wrapped.returncode == 2,
                  "Invalid input did not return exit code 2.",
                  direct,
                  wrapped,
              )
              require(
                  direct.stdout == wrapped.stdout == b""
                  and direct.stderr == wrapped.stderr,
                  "Windows entry points returned different invalid-input streams.",
                  direct,
                  wrapped,
              )
