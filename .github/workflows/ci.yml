name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  julia-factored-gsn:
    runs-on: ubuntu-latest
    # The authenticated PR75 lifecycle now includes the real Julia worker
    # process seam after the complete vendored suite and regression harnesses.
    timeout-minutes: 60
    env:
      M02_PROJECT: .ci/m02-project
      M02_PROJECT_SEED: src/windows_solver/data/julia/m02_project
      GSN_PROJECT: src/windows_solver/data/julia/GeneralizedSasakiNakamura.jl
      ANGULAR_PROJECT: src/windows_solver/data/julia/SpinWeightedSpheroidalHarmonics.jl
      JULIA_NUM_THREADS: "1"
      JULIA_NUM_PRECOMPILE_TASKS: "4"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.10.11"
      - name: Materialize pinned M02 Julia project
        shell: bash
        run: |
          julia --startup-file=no --history-file=no -e '
            seed_project = abspath(ENV["M02_PROJECT_SEED"])
            project = abspath(ENV["M02_PROJECT"])
            mkpath(project)
            cp(
              joinpath(seed_project, "Project.toml"),
              joinpath(project, "Project.toml");
              force=true,
            )
            let manifest = read(joinpath(seed_project, "Manifest.seed.toml"), String)
              for source in (ENV["GSN_PROJECT"], ENV["ANGULAR_PROJECT"])
                source_path = abspath(source)
                seed_path = string(
                  "path = \"../vendor/", basename(source_path), "\""
                )
                pinned_path = string(
                  "path = \"", replace(source_path, "\\" => "/"), "\""
                )
                occursin(seed_path, manifest) || error(
                  "seed manifest lacks path dependency: $seed_path"
                )
                manifest = replace(manifest, seed_path => pinned_path)
              end
              occursin("../vendor/", manifest) && error(
                "materialized manifest retains a seed vendor path"
              )
              write(joinpath(project, "Manifest.toml"), manifest)
            end
          '
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
      - name: Instantiate and precompile pinned M02 project
        shell: bash
        run: |
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" -e '
            using Pkg
            Pkg.instantiate()
            Pkg.precompile()
          '
      - name: Run complete vendored GSN unit set
        shell: bash
        run: |
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" -e '
            include(joinpath(ENV["GSN_PROJECT"], "test", "runtests.jl"))
          '
      - name: Run worker determinant and finite-difference authentication regression
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/m02-promoted-request-contract.json"
          preflight_batch="$RUNNER_TEMP/m02-promoted-request-batch.json"
          preflight_response="$RUNNER_TEMP/m02-promoted-request-response.json"
          PYTHONPATH=src python tools/preflight_m02_promoted_request.py \
            --write-contract-fixture "$fixture"
          PYTHONPATH=src python tools/preflight_m02_promoted_request.py \
            --write-preflight-batch "$preflight_batch"
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" \
            src/windows_solver/data/julia/m02_worker.jl \
            --validate-request-batch "$preflight_batch" "$preflight_response"
          PYTHONPATH=src python tools/preflight_m02_promoted_request.py \
            --verify-preflight-response \
            "$preflight_batch" "$preflight_response"
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" \
            src/windows_solver/data/julia/m02_worker_finite_difference_spec.jl
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" \
            src/windows_solver/data/julia/m02_worker_fixed_root_diagnostic_spec.jl \
            "$fixture"
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" \
            src/windows_solver/data/julia/m02_worker_request_contract_spec.jl \
            "$fixture"
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" \
            tools/leaf13_horizon_harness_spec.jl
      - name: Run PR75 fixed-root lifecycle through real Julia without solver kernels
        shell: bash
        run: |
          cases="$RUNNER_TEMP/pr75-fixed-root-cases.json"
          results="$RUNNER_TEMP/pr75-fixed-root-results.json"
          PYTHONPATH=src python tests/pr75_fixed_root_contract_fixture.py \
            write "$cases"
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" \
            tests/julia/test_pr75_fixed_root_lifecycle.jl \
            "$cases" "$results"
          PYTHONPATH=src python tests/pr75_fixed_root_contract_fixture.py \
            verify "$cases" "$results"
          PR75_FIXED_ROOT_CASES="$cases" \
          PR75_FIXED_ROOT_RESULTS="$results" \
          PYTHONPATH=src python -m unittest \
            tests.test_pr75_fixed_root_lifecycle -v
          PR75_REAL_WORKER_PROCESS=1 \
          PYTHONPATH=src python -m unittest \
            tests.test_pr75_fixed_root_process_seam -v

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install ".[numerical-tests]"
      - name: Build and inspect wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import zipfile

          subprocess.run(
              [sys.executable, "-m", "pip", "wheel", ".", "--no-deps", "--wheel-dir", "dist"],
              check=True,
          )
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise AssertionError(f"expected one wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              packaged_worker = wheel.read("windows_solver/data/julia/m02_worker.jl")
          required = {
              "windows_solver/linear_response_admission.py",
              "windows_solver/data/kerr_qnm_roots_2736.csv",
              "windows_solver/data/kerr_qnm_lattice_receipt.json",
              "windows_solver/data/fixed_root_reliability_projection_authority_v1.json",
              "windows_solver/data/julia/m02_worker.jl",
              "windows_solver/data/LICENSE-CANONICAL-BACKEND-MIT.txt",
              "windows_solver/data/LICENSE-CC-BY-4.0.txt",
              "windows_solver/data/LICENSE-QNM-MIT.txt",
          }
          missing = required - names
          forbidden = {
              name for name in names
              if "roots_91" in name
              or "benchmark_receipt" in name
              or "independent_benchmarks" in name
              or "catalog_receipt" in name
          }
          if missing or forbidden:
              raise AssertionError(f"wheel data mismatch: missing={missing}, forbidden={forbidden}")
          source_worker = Path("src/windows_solver/data/julia/m02_worker.jl").read_bytes()
          if packaged_worker != source_worker:
              raise AssertionError("packaged m02_worker.jl differs from canonical source")
      - name: Compile Python
        run: python -m compileall -q src tests tools
      - name: Verify critical production capability wiring
        run: python -m windows_solver.production_wiring
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run M02 admission and cache gate
