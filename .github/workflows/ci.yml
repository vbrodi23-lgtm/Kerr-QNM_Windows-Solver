name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  leaf13-source-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/leaf13-mixed-phase-endpoint-evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install ".[numerical-tests]"
      - name: Reconfirm the production regression is red
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m unittest -v \
            tests.test_leaf13_mixed_phase_endpoint_evidence \
            > leaf13-red.log 2>&1
          status=$?
          set -e
          cat leaf13-red.log
          if [ "$status" -eq 0 ]; then
            echo "Leaf 13 regression unexpectedly passed before the repair" >&2
            exit 1
          fi
          grep -q \
            "test_accepts_primary_truncation_resolution_endpoint_evidence" \
            leaf13-red.log
          grep -q "horizon endpoint search evidence is invalid" leaf13-red.log
      - name: Apply the mixed-phase endpoint validator repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/windows_solver/response_engine.py")
          text = path.read_text(encoding="utf-8")

          old_orders = '''    expected_orders: list[int] = []
              order = base_order
              while order < maximum_order:
                  expected_orders.append(order)
                  order += order
              expected_orders.append(maximum_order)
          '''.replace("          ", "")
          new_orders = '''    def endpoint_order_ladder(candidate_base_order: int) -> list[int]:
              values: list[int] = []
              order = candidate_base_order
              while order < maximum_order:
                  values.append(order)
                  order += order
              values.append(maximum_order)
              return values

              allowed_base_orders = {base_order}
              if (
                  not allow_historical_schema7_policy
                  and request_binding.get("operation") == "root-readout"
                  and policy.get("promoted_root_readout_policy")
                  == PROMOTED_ROOT_READOUT_POLICY
                  and base_order + 8 <= maximum_order
              ):
                  # Schema v9 accumulates PRIMARY, TRUNCATION, and RESOLUTION
                  # endpoint searches in one response. TRUNCATION alone raises
                  # the endpoint base order by exactly eight.
                  allowed_base_orders.add(base_order + 8)
              expected_order_ladders = {
                  tuple(endpoint_order_ladder(candidate_base_order))
                  for candidate_base_order in sorted(allowed_base_orders)
              }
              expected_orders: list[int] = []
              observed_order_ladders: set[tuple[int, ...]] = set()
          '''.replace("          ", "")

          old_validation = '''        if (
              item["outcome"] != expected_outcome
              or item["policy_identity"] != policy_identity
              or not isinstance(selected_pair, list)
              or len(selected_pair) != required_selected_count
              or not isinstance(rejected, list)
              or not isinstance(orders, list)
              or not orders
              or any(
                  isinstance(order, bool)
                  or not isinstance(order, int)
                  or order < 1
                  for order in orders
              )
              or orders != expected_orders
              or item["homogeneous_rhs_evaluations_before_pair"] != 0
          ):
              raise ValueError("horizon endpoint search evidence is invalid")
          '''.replace("          ", "")
          new_validation = '''        if (
              not isinstance(orders, list)
              or not orders
              or any(
                  isinstance(order, bool)
                  or not isinstance(order, int)
                  or order < 1
                  for order in orders
              )
          ):
              raise ValueError("horizon endpoint search evidence is invalid")
              order_ladder = tuple(orders)
              if (
                  order_ladder not in expected_order_ladders
                  or item["outcome"] != expected_outcome
                  or item["policy_identity"] != policy_identity
                  or not isinstance(selected_pair, list)
                  or len(selected_pair) != required_selected_count
                  or not isinstance(rejected, list)
                  or item["homogeneous_rhs_evaluations_before_pair"] != 0
              ):
                  raise ValueError("horizon endpoint search evidence is invalid")
              expected_orders = list(order_ladder)
              observed_order_ladders.add(order_ladder)
          '''.replace("          ", "")

          old_return = '''        if item["outcome"] != recomputed_outcome:
              raise ValueError("horizon endpoint recovery outcome is invalid")
              return canonical
          '''.replace("          ", "")
          new_return = '''        if item["outcome"] != recomputed_outcome:
              raise ValueError("horizon endpoint recovery outcome is invalid")
              primary_order_ladder = tuple(endpoint_order_ladder(base_order))
              if primary_order_ladder not in observed_order_ladders:
                  raise ValueError("horizon endpoint PRIMARY evidence is missing")
              return canonical
          '''.replace("          ", "")

          for old, new, label in (
              (old_orders, new_orders, "order ladder"),
              (old_validation, new_validation, "per-record validation"),
              (old_return, new_return, "PRIMARY evidence gate"),
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one {label} patch site, found {count}"
                  )
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Prove the focused repair is green
        shell: bash
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest -v \
            tests.test_leaf13_mixed_phase_endpoint_evidence \
            tests.test_julia_response_backend
          git diff --check
      - name: Commit the production repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/windows_solver/response_engine.py
          git commit -m "fix(m02): authenticate mixed-phase endpoint evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  julia-factored-gsn:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'fix/leaf13-mixed-phase-endpoint-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      M02_PROJECT: .ci/m02-project
      M02_PROJECT_SEED: src/windows_solver/data/julia/m02_project
      GSN_PROJECT: src/windows_solver/data/julia/GeneralizedSasakiNakamura.jl
      ANGULAR_PROJECT: src/windows_solver/data/julia/SpinWeightedSpheroidalHarmonics.jl
      JULIA_NUM_THREADS: "1"
      JULIA_NUM_PRECOMPILE_TASKS: "4"
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.10.11"
      - name: Materialize pinned M02 Julia project
        shell: bash
        run: |
          julia --startup-file=no --history-file=no -e '
            seed_project = abspath(ENV["M02_PROJECT_SEED"])
            project = abspath(ENV["M02_PROJECT"])
            mkpath(project)
            cp(
              joinpath(seed_project, "Project.toml"),
              joinpath(project, "Project.toml");
              force=true,
            )
            let manifest = read(joinpath(seed_project, "Manifest.seed.toml"), String)
              for source in (ENV["GSN_PROJECT"], ENV["ANGULAR_PROJECT"])
                source_path = abspath(source)
                seed_path = string(
                  "path = \"../vendor/", basename(source_path), "\""
                )
                pinned_path = string(
                  "path = \"", replace(source_path, "\\" => "/"), "\""
                )
                occursin(seed_path, manifest) || error(
                  "seed manifest lacks path dependency: $seed_path"
                )
                manifest = replace(manifest, seed_path => pinned_path)
              end
              occursin("../vendor/", manifest) && error(
                "materialized manifest retains a seed vendor path"
              )
              write(joinpath(project, "Manifest.toml"), manifest)
            end
          '
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
      - name: Instantiate and precompile pinned M02 project
        shell: bash
        run: |
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" -e '
            using Pkg
            Pkg.instantiate()
            Pkg.precompile()
          '
      - name: Run complete vendored GSN unit set
        shell: bash
        run: |
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" -e '
            include(joinpath(ENV["GSN_PROJECT"], "test", "runtests.jl"))
          '
      - name: Run worker determinant and finite-difference authentication regression
        shell: bash
        run: |
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" \
            src/windows_solver/data/julia/m02_worker_finite_difference_spec.jl
          julia --startup-file=no --history-file=no --project="$M02_PROJECT" \
            tools/leaf13_horizon_harness_spec.jl

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'fix/leaf13-mixed-phase-endpoint-evidence'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install ".[numerical-tests]"
      - name: Build and inspect wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import zipfile

          subprocess.run(
              [sys.executable, "-m", "pip", "wheel", ".", "--no-deps", "--wheel-dir", "dist"],
              check=True,
          )
          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise AssertionError(f"expected one wheel, found {wheels}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          required = {
              "windows_solver/linear_response_admission.py",
              "windows_solver/data/kerr_qnm_roots_2736.csv",
              "windows_solver/data/kerr_qnm_lattice_receipt.json",
              "windows_solver/data/LICENSE-CANONICAL-BACKEND-MIT.txt",
              "windows_solver/data/LICENSE-CC-BY-4.0.txt",
              "windows_solver/data/LICENSE-QNM-MIT.txt",
          }
          missing = required - names
          forbidden = {
              name for name in names
              if "roots_91" in name
              or "benchmark_receipt" in name
              or "independent_benchmarks" in name
              or "catalog_receipt" in name
          }
          if missing or forbidden:
              raise AssertionError(f"wheel data mismatch: missing={missing}, forbidden={forbidden}")
      - name: Compile Python
        run: python -m compileall -q src tests tools
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run M02 admission and cache gate
        run: python -m unittest tests.test_linear_response_admission -v
      - name: Run M02 head-tail-risk campaign smoke
        run: solver campaign-smoke
      - name: Plan full evidence request
        run: solver plan examples/evidence-plan.json
      - name: Run admitted provider
        run: solver run examples/problem-contract.json --store "${{ runner.temp }}/solver-store"
      - name: Run admitted spectrum provider
        run: solver run examples/spectrum.json --store "${{ runner.temp }}/spectrum-store"
      - name: Verify Windows PowerShell 5.1 launcher parity
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          root = Path.cwd()
          windows_powershell = Path(os.environ["SystemRoot"]).joinpath(
              "System32", "WindowsPowerShell", "v1.0", "powershell.exe"
          )
          module = [sys.executable, "-m", "windows_solver"]
          launcher = [
              str(windows_powershell),
              "-NoLogo",
              "-NoProfile",
              "-NonInteractive",
              "-ExecutionPolicy",
              "Bypass",
              "-File",
              str(root / "solver.ps1"),
          ]

          def invoke(prefix, *arguments):
              return subprocess.run(
                  [*prefix, *(str(argument) for argument in arguments)],
                  cwd=root,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )

          def require(condition, message, *results):
              if condition:
                  return
              details = "\n".join(
                  f"rc={result.returncode} stdout={result.stdout!r} "
                  f"stderr={result.stderr!r}"
                  for result in results
              )
              raise AssertionError(f"{message}\n{details}")

          request = root / "examples" / "evidence-plan.json"
          direct = invoke(module, "plan", request)
          wrapped = invoke(launcher, "plan", request)
          require(
              direct.returncode == wrapped.returncode == 0,
              "Plan command failed through one Windows entry point.",
              direct,
              wrapped,
          )
          require(
              direct.stdout == wrapped.stdout and direct.stderr == wrapped.stderr == b"",
              "Windows entry points returned different plan streams.",
              direct,
              wrapped,
          )

          direct = invoke(module, "campaign-smoke")
          wrapped = invoke(launcher, "campaign-smoke")
          require(
              direct.returncode == wrapped.returncode == 0,
              "M02 campaign smoke failed through one Windows entry point.",
              direct,
              wrapped,
          )
          require(
              direct.stdout == wrapped.stdout and direct.stderr == wrapped.stderr == b"",
              "Windows entry points returned different M02 smoke streams.",
              direct,
              wrapped,
          )

          with tempfile.TemporaryDirectory() as temporary:
              temporary = Path(temporary)
              spectrum_request = root / "examples" / "spectrum.json"
              direct = invoke(
                  module,
                  "run",
                  spectrum_request,
                  "--store",
                  temporary / "module-spectrum",
              )
              wrapped = invoke(
                  launcher,
                  "run",
                  spectrum_request,
                  "--store",
                  temporary / "launcher-spectrum",
              )
              require(
                  direct.returncode == wrapped.returncode == 0,
                  "Admitted spectrum failed through one Windows entry point.",
                  direct,
                  wrapped,
              )
              require(
                  direct.stderr == wrapped.stderr == b"",
                  "Admitted spectrum unexpectedly wrote stderr.",
                  direct,
                  wrapped,
              )
              direct_run = json.loads(direct.stdout)
              wrapped_run = json.loads(wrapped.stdout)
              require(
                  direct_run["artifact_ids"] == wrapped_run["artifact_ids"]
                  and direct_run["provider_execution_count"]
                  == wrapped_run["provider_execution_count"]
                  == 2,
                  "Windows entry points returned different spectrum artifacts.",
                  direct,
                  wrapped,
              )

              direct = invoke(
                  module,
                  "run",
                  request,
                  "--store",
                  temporary / "module-unavailable",
              )
              wrapped = invoke(
                  launcher,
                  "run",
                  request,
                  "--store",
                  temporary / "launcher-unavailable",
              )
              require(
                  direct.returncode == wrapped.returncode == 3,
                  "Unavailable science did not return exit code 3.",
                  direct,
                  wrapped,
              )
              require(
                  direct.stdout == wrapped.stdout == b"",
                  "Unavailable science unexpectedly wrote stdout.",
                  direct,
                  wrapped,
              )
              direct_error = json.loads(direct.stderr)
              wrapped_error = json.loads(wrapped.stderr)
              require(
                  direct_error["error"]["code"]
                  == wrapped_error["error"]["code"]
                  == "PROVIDER_UNAVAILABLE",
                  "Windows entry points returned different error contracts.",
                  direct,
                  wrapped,
              )
              require(
                  direct_error["error"]["run"]["unavailable_capability"]
                  == wrapped_error["error"]["run"]["unavailable_capability"],
                  "Windows entry points disagreed on unavailable capability.",
                  direct,
                  wrapped,
              )

              invalid = temporary / "invalid-study.json"
              invalid.write_bytes(b"{}")
              direct = invoke(module, "plan", invalid)
              wrapped = invoke(launcher, "plan", invalid)
              require(
                  direct.returncode == wrapped.returncode == 2,
                  "Invalid input did not return exit code 2.",
                  direct,
                  wrapped,
              )
              require(
                  direct.stdout == wrapped.stdout == b""
                  and direct.stderr == wrapped.stderr,
                  "Windows entry points returned different invalid-input streams.",
                  direct,
                  wrapped,
              )
