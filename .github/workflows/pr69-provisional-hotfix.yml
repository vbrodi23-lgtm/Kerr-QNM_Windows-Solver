name: PR69 provisional-stage contract repair

on:
  push:
    branches:
      - claude/pr69-dashboard-fix

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pr69-dashboard-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply stage-type-aware provisional publication repair
        run: python .github/pr69_hotfix.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e . pytest
      - name: Run targeted mocked and scheduler tests
        run: |
          python -m pytest -q \
            tests/test_pr69_provisional_stage_publication.py \
            tests/test_binary64_survey_scheduler.py
      - name: Compile and check patch
        run: |
          python -m compileall -q src/windows_solver tests/test_pr69_provisional_stage_publication.py
          git diff --check
      - name: Commit repair and remove temporary delivery files
        run: |
          rm .github/workflows/pr69-provisional-hotfix.yml
          rm .github/pr69_hotfix.py
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "fix(pr69): authenticate horizon provisional stage publication"
          git push origin HEAD:claude/pr69-dashboard-fix
